gni giorno.",ref:"Artt. 84, 87, 89, 96 TUIR"}]},{id:"u1l2",title:"Perdite e interessi",icon:"📉",questions:[{type:"mc",prompt:"Le perdite fiscali pregresse possono essere utilizzate a riduzione del reddito di ciascun periodo nel limite del…",options:["50%","60%","80%","100%"],answer:2,why:"Il riporto è illimitato nel tempo, ma entro l’80% del reddito imponibile di ciascun periodo d’imposta.",ref:"Art. 84, co. 1, TUIR"},{type:"tf",prompt:"Le perdite dei primi tre periodi d’imposta di una nuova attività sono computabili in misura piena (senza il limite dell’80%).",answer:!0,why:"Le perdite “di start‑up” sono riportabili integralmente, purché riferite a una nuova attività produttiva.",ref:"Art. 84, co. 2, TUIR"},{type:"mc",prompt:"Gli interessi passivi netti sono deducibili entro quale limite?",options:["10% dei ricavi","30% del ROL","50% dell’EBIT","Senza limiti"],answer:1,why:"L’eccedenza di interessi passivi su quelli attivi è deducibile nel limite del 30% del risultato operativo lordo (ROL) della gestione caratteristica.",ref:"Art. 96 TUIR"},{type:"fill",before:"Gli interessi passivi netti non dedotti in un periodo sono riportabili",after:"nei periodi d’imposta successivi.",options:["per 3 anni","per 5 anni","senza limiti di tempo","solo nell’anno successivo"],answer:2,why:"L’eccedenza di interessi indeducibili è riportabile in avanti senza limiti temporali.",ref:"Art. 96 TUIR"},{type:"tf",prompt:"Dopo il recepimento della direttiva ATAD, il ROL rilevante ai fini dell’art. 96 è determinato sulla base dei valori fiscali.",answer:!0,why:"Il D.Lgs. 142/2018 ha introdotto il “ROL fiscale”, calcolato assumendo i componenti positivi e negativi rilevanti ai fini fiscali.",ref:"Art. 96 TUIR; D.Lgs. 142/2018"}]}]},{id:"u2",title:"Unità 2 · Partecipazioni e dividendi",subtitle:"PEX, dividendi e ritenute in uscita",tone:"bg-tag-blue",lessons:[{id:"u2l1",title:"Participation exemption",icon:"🧩",questions:[{type:"mc",prompt:"In regime PEX, le plusvalenze su partecipazioni sono esenti nella misura del…",options:["50%","60%","95%","100%"],answer:2,why:"Le plusvalenze che soddisfano i requisiti PEX non concorrono a formare il reddito per il 95% del loro ammontare.",ref:"Art. 87, co. 1, TUIR"},{type:"mc",prompt:"Qual è l’holding period minimo richiesto per la PEX?",options:["6 mesi","12 mesi","18 mesi","36 mesi"],answer:1,why:"La partecipazione deve essere posseduta ininterrottamente dal primo giorno del dodicesimo mese precedente la cessione (criterio LIFO).",ref:"Art. 87, co. 1, lett. a), TUIR"},{type:"tf",prompt:"Per la PEX la partecipazione deve essere classificata tra le immobilizzazioni finanziarie nel primo bilancio chiuso durante il periodo di possesso.",answer:!0,why:"È il requisito di classificazione contabile previsto dalla lett. b).",ref:"Art. 87, co. 1, lett. b), TUIR"},{type:"fill",before:"I requisiti di residenza fiscale e di",after:"della partecipata devono sussistere ininterrottamente dall’inizio del terzo periodo d’imposta anteriore al realizzo.",options:["commercialità","solidità","liquidità","territorialità"],answer:0,why:"La partecipata deve esercitare un’impresa commerciale e non essere residente in uno Stato a regime fiscale privilegiato.",ref:"Art. 87, co. 1, lett. c) e d), e co. 2, TUIR"},{type:"tf",prompt:"Le minusvalenze realizzate su partecipazioni con i requisiti PEX sono deducibili.",answer:!1,why:"Simmetria del regime: se la plusvalenza è esente, la minusvalenza è indeducibile.",ref:"Art. 101, co. 1, TUIR"}]},{id:"u2l2",title:"Dividendi e ritenute",icon:"💶",questions:[{type:"mc",prompt:"I dividendi percepiti da una società IRES residente concorrono al reddito per il…",options:["5%","26%","40%","95%"],answer:0,why:"I dividendi sono esclusi dal reddito per il 95%: concorre solo il 5% del loro ammontare.",ref:"Art. 89, co. 2, TUIR"},{type:"mc",prompt:"Qual è la ritenuta ordinaria sui dividendi corrisposti a soggetti non residenti (salvo convenzioni o direttive)?",options:["1,2%","12,5%","26%","30%"],answer:2,why:"Si applica la ritenuta a titolo d’imposta del 26%, riducibile in base a convenzione o direttiva.",ref:"Art. 27, co. 3, D.P.R. 600/1973"},{type:"mc",prompt:"Dividendi a società residente in UE/SEE (white list), soggetta a imposta sul reddito, che non beneficia della direttiva madre‑figlia: quale ritenuta?",options:["0%","1,2%","5%","26%"],answer:1,why:"La ritenuta ridotta è pari all’1,20%, per allineare il carico al regime domestico (5% × aliquota IRES).",ref:"Art. 27, co. 3‑ter, D.P.R. 600/1973"},{type:"tf",prompt:"Per l’esenzione da ritenuta della direttiva madre‑figlia serve una partecipazione diretta di almeno il 10%, detenuta ininterrottamente da almeno un anno.",answer:!0,why:"Sono i requisiti di partecipazione e holding period previsti dalla norma di recepimento.",ref:"Art. 27‑bis D.P.R. 600/1973"},{type:"tf",prompt:"I dividendi provenienti da Stati a regime fiscale privilegiato concorrono, in linea di principio, integralmente al reddito del percettore.",answer:!0,why:"Salvo dimostrazione dell’esimente, non si applica l’esclusione del 95%.",ref:"Artt. 47‑bis e 89, co. 3, TUIR"}]}]},{id:"u3",title:"Unità 3 · Gruppi e internazionale",subtitle:"Consolidato, transfer pricing, Pillar Two",tone:"bg-tag-violet",lessons:[{id:"u3l1",title:"Consolidato e TP",icon:"🌍",questions:[{type:"mc",prompt:"L’opzione per il consolidato fiscale nazionale è irrevocabile per…",options:["1 esercizio","3 esercizi","5 esercizi","9 esercizi"],answer:1,why:"L’opzione ha durata triennale ed è irrevocabile; si rinnova tacitamente salvo revoca.",ref:"Art. 117, co. 3, TUIR"},{type:"tf",prompt:"Per accedere al consolidato nazionale la controllante deve detenere, direttamente o indirettamente, più del 50% dei diritti di voto e della partecipazione agli utili.",answer:!0,why:"Il requisito di controllo è più stringente di quello civilistico e si verifica anche sulla partecipazione agli utili.",ref:"Artt. 117 e 120 TUIR"},{type:"mc",prompt:"Quale norma disciplina il transfer pricing in Italia?",opti
